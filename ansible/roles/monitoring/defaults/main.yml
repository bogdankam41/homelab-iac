---
# Pinned component versions. Bump here (or from Terraform) and re-apply —
# the role replaces a binary only when the version on disk differs.
prometheus_version: "3.5.0"
alertmanager_version: "0.28.1"
blackbox_exporter_version: "0.28.0"
# Empty = latest package from the Grafana apt repo; or pin e.g. "11.6.1".
grafana_version: ""

# --- Prometheus ---------------------------------------------------------
prometheus_listen_address: "0.0.0.0:9090"
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"
prometheus_retention_time: "30d"
prometheus_external_labels: {}

# --- Monitored devices --------------------------------------------------
# The list of devices comes from terraform.tfvars (monitoring_targets).
# Every entry: { name, address, job (optional), labels (optional map) }.
monitoring_targets: []
# Job used by targets that do not name one — plain node_exporter hosts.
monitoring_default_job: node
# Scrape the monitoring VM itself as well, under this name.
monitoring_scrape_self: true
monitoring_self_name: "{{ inventory_hostname }}"
# Extra labels for that self target, like monitoring_targets[].labels.
monitoring_self_labels: {}

# --- Probes (blackbox_exporter) -----------------------------------------
# Each entry: { name, target, module, job }. Modules: http_2xx, tcp_connect.
# One scrape job per distinct `job`, so alerts can tell paths apart.
monitoring_probes: []
blackbox_listen_address: "127.0.0.1:9115"

# --- Proxmox VE (prometheus-pve-exporter) -------------------------------
# Each entry: { name, address, token_id, token_secret, labels (optional map) }.
# token_id is "user@realm!tokenname" of a read-only (PVEAuditor) API token.
# Empty list = the exporter is not installed and the pve job is not rendered.
monitoring_pve_nodes: []
pve_exporter_version: "3.10.1"
pve_exporter_listen_address: "127.0.0.1:9221"

# --- Network switches ---------------------------------------------------
# SNMP devices. Each entry: { name, address, community, modules (optional
# list, default ["system", "if_mib"]), labels (optional map) }. community is
# SNMPv2c, read-only.
# Empty list = snmp_exporter is not installed and the snmp job is not rendered.
monitoring_snmp_targets: []
snmp_exporter_version: "0.30.1"
snmp_exporter_listen_address: "127.0.0.1:9116"
# SKS3200-series switches without SNMP, read through their web UI's JSON API.
# Each entry: { name, address, username, password, labels (optional map) }.
monitoring_sks_switches: []
sks_exporter_listen_address: "127.0.0.1:9117"
# Switch CPUs are weak (an SNMP walk or a web login is noticeable on them).
monitoring_switch_scrape_interval: "30s"

# --- Video recorders ----------------------------------------------------
# XiongMai-based NVR/DVR (NETSurveillance web UI, XMeye app), read over their
# DVRIP protocol (TCP 34567) by dvrip_exporter. Each entry: { name, address,
# username, password, labels (optional map) }.
# Empty list = dvrip_exporter is not installed and the dvr job is not rendered.
monitoring_dvr_recorders: []
dvrip_exporter_listen_address: "127.0.0.1:9118"
monitoring_dvr_scrape_interval: "30s"

# --- Federation from other Prometheus servers ---------------------------
# Each entry: { job, address, match (optional list), labels (optional map) }.
# Pulls a selected set of series from another Prometheus's /federate — e.g. the
# k3s cluster's kube-prometheus-stack, which keeps only a few days of history.
monitoring_federation: []
monitoring_federation_interval: "30s"
# Series an entry pulls when it names no match[] of its own: exactly what the
# k3s overview dashboard reads. Raw cadvisor/apiserver histograms stay behind
# (~130k series) — the dashboard uses kube-prometheus-stack's recording rules.
monitoring_federation_match:
  - '{job="kube-state-metrics"}'
  - '{job="kubelet", __name__=~"kubelet_volume_stats_(used|capacity)_bytes|kubelet_running_pods"}'
  - '{job="apiserver", __name__="apiserver_request_total"}'
  - '{__name__=~"namespace_(cpu|memory):kube_pod_container_resource_(requests|limits):sum"}'
  - '{__name__=~"cluster:namespace:pod_(cpu|memory):active:kube_pod_container_resource_(requests|limits)"}'
  - '{__name__=~"node_namespace_pod_container:container_(cpu_usage_seconds_total:sum_rate5m|memory_working_set_bytes)"}'
  - '{__name__="cluster_quantile:apiserver_request_sli_duration_seconds:histogram_quantile"}'

# --- Targets behind TLS + basic auth (e.g. a host outside the LAN) -------
# Each entry: { name, address, job, ca_cert (PEM), username, password }.
monitoring_secure_targets: []

# --- Alerting -----------------------------------------------------------
monitoring_alerts_enabled: true
alertmanager_listen_address: "0.0.0.0:9093"
alertmanager_resolve_timeout: "5m"
# Empty token = alerts are evaluated and visible in the UI but not delivered.
alertmanager_telegram_bot_token: ""
alertmanager_telegram_chat_id: ""

# Alert thresholds (percent / duration).
alert_instance_down_for: "5m"
alert_cpu_threshold: 90
alert_cpu_for: "10m"
alert_memory_threshold: 90
alert_memory_for: "10m"
alert_disk_threshold: 85
alert_disk_for: "15m"
# Temperature (node_exporter hwmon collector). Only the chips worth alerting on:
# CPU package/cores and disks. Board/ACPI zones and battery sensors are noisy and
# report meaningless values on some hardware, so they stay out of the rule.
alert_temp_threshold: 85
alert_temp_for: "5m"
alert_temp_chips: ".*coretemp.*|.*k10temp.*|.*cpu_thermal.*|.*nvme.*|.*drivetemp.*"
# Switches: link changes per port in 15 min, bad packets per port in 15 min,
# board temperature (a switch board runs much cooler than a CPU).
alert_switch_flaps: 4
alert_switch_errors: 100
alert_switch_temp_threshold: 70
# Video recorders: the newest video on disk older than this (seconds) means
# recording has stopped; an archive shorter than this many days is too short.
alert_dvr_record_age: 600
alert_dvr_archive_days: 7

# --- Grafana ------------------------------------------------------------
grafana_listen_port: 3000
grafana_admin_user: admin
grafana_admin_password: admin
grafana_datasource_uid: prometheus
# Extra Prometheus datasources next to the local one. Each entry: { name, uid, url }.
# The k3s overview dashboard expects uid "k3s" (the cluster's own Prometheus).
grafana_extra_datasources: []
# Dashboard file (in /var/lib/grafana/dashboards) shown as Grafana's home page.
grafana_home_dashboard: homelab-overview.json
# Dashboards pulled from grafana.com and provisioned on disk.
grafana_dashboards:
  - name: node-exporter-full
    gnet_id: 1860
    revision: 37
# Dashboards kept in this repo (roles/monitoring/files/dashboards/*.json) are
# provisioned as well — for boards that do not exist on grafana.com.
