---
- name: Check the installed blackbox_exporter version
  ansible.builtin.command: /usr/local/bin/blackbox_exporter --version
  register: blackbox_installed
  changed_when: false
  failed_when: false

- name: Install blackbox_exporter {{ blackbox_exporter_version }}
  when: blackbox_exporter_version not in (blackbox_installed.stdout | default('') ~ blackbox_installed.stderr | default(''))
  vars:
    bb_name: "blackbox_exporter-{{ blackbox_exporter_version }}.linux-amd64"
    bb_base: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_version }}"
  block:
    # get_url checks the archive against the release's sha256sums.txt.
    - name: Download the blackbox_exporter release
      ansible.builtin.get_url:
        url: "{{ bb_base }}/{{ bb_name }}.tar.gz"
        dest: "/opt/{{ bb_name }}.tar.gz"
        checksum: "sha256:{{ bb_base }}/sha256sums.txt"
        mode: '0644'
      register: blackbox_download
      until: blackbox_download is succeeded
      retries: 5
      delay: 10

    - name: Unpack the blackbox_exporter release
      ansible.builtin.unarchive:
        src: "/opt/{{ bb_name }}.tar.gz"
        dest: /opt/
        remote_src: true

    - name: Put the blackbox_exporter binary in place
      ansible.builtin.copy:
        src: "/opt/{{ bb_name }}/blackbox_exporter"
        dest: /usr/local/bin/blackbox_exporter
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      notify: Restart blackbox_exporter

- name: Create the blackbox_exporter config directory
  ansible.builtin.file:
    path: /etc/blackbox_exporter
    state: directory
    owner: root
    group: prometheus
    mode: '0755'

- name: Deploy blackbox.yml
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: /etc/blackbox_exporter/blackbox.yml
    owner: root
    group: prometheus
    mode: '0644'
    validate: /usr/local/bin/blackbox_exporter --config.check --config.file=%s
  notify: Reload blackbox_exporter

- name: Install the blackbox_exporter systemd unit
  ansible.builtin.template:
    src: blackbox_exporter.service.j2
    dest: /etc/systemd/system/blackbox_exporter.service
    mode: '0644'
  notify: Restart blackbox_exporter

- name: Ensure blackbox_exporter is started and enabled
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: started
    enabled: true
    daemon_reload: true
