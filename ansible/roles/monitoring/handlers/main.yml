---
# Prometheus and Alertmanager reload their config on SIGHUP — no scrape gap.
- name: Reload prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: reloaded
  failed_when: false

- name: Restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted
    daemon_reload: true

- name: Reload alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: reloaded
  failed_when: false

- name: Restart alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    state: restarted
    daemon_reload: true

- name: Restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted
    daemon_reload: true

- name: Reload blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: reloaded
  failed_when: false

- name: Restart blackbox_exporter
  ansible.builtin.systemd:
    name: blackbox_exporter
    state: restarted
    daemon_reload: true

# pve_exporter reads pve.yml only at start.
- name: Restart pve_exporter
  ansible.builtin.systemd:
    name: pve_exporter
    state: restarted
    daemon_reload: true

- name: Restart snmp_exporter
  ansible.builtin.systemd:
    name: snmp_exporter
    state: restarted
    daemon_reload: true

- name: Restart sks_exporter
  ansible.builtin.systemd:
    name: sks_exporter
    state: restarted
    daemon_reload: true

# dvrip_exporter keeps a DVRIP session per recorder; a restart just logs in again.
- name: Restart dvrip_exporter
  ansible.builtin.systemd:
    name: dvrip_exporter
    state: restarted
    daemon_reload: true
