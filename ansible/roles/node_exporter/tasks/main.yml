---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Check the installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

# Same pattern as the AdGuard role: the binary is only touched when the pinned
# version actually differs from what is on disk.
- name: Install node_exporter {{ node_exporter_version }}
  when: node_exporter_version not in (node_exporter_installed.stderr | default('') ~ node_exporter_installed.stdout | default(''))
  vars:
    ne_name: "node_exporter-{{ node_exporter_version }}.linux-amd64"
  block:
    - name: Download and unpack the node_exporter release
      ansible.builtin.unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ ne_name }}.tar.gz"
        dest: /opt/
        remote_src: true
      register: node_exporter_download
      until: node_exporter_download is succeeded
      retries: 5
      delay: 10

    - name: Put the node_exporter binary in place
      ansible.builtin.copy:
        src: "/opt/{{ ne_name }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      notify: Restart node_exporter

- name: Install the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: Restart node_exporter

- name: Ensure node_exporter is started and enabled
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
